[package]
name = "starstream-ledger"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[[test]]
name = "proving"
required-features = ["proving"]

[[test]]
name = "ledger"
required-features = ["client", "http", "server", "tcp"]

[features]
default = ["client", "genesis", "http", "proving", "server", "tcp"]
client = ["dep:wasmtime-wizer"]
http = [
    "dep:http-body",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower-http",
    "dep:wrpc-http",
    "hyper-util/client",
    "hyper-util/client-legacy",
    "wrpc-http/client-legacy",
]
genesis = ["client", "dep:wasm-wave", "wasmtime/wave"]
proving = ["client", "dep:starstream-proving-runtime"]
server = [
    "dep:anyhow",
    "dep:wit-component",
    "dep:wit-parser",
]
tcp = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio-io-timeout",
    "hyper-util/server",
    "hyper-util/server-graceful",
    "hyper-util/tokio",
    "tokio/net",
    "tokio/rt",
    "tokio/time",
]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
coset = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true, features = ["fast", "std", "zeroize"] }
form_urlencoded = { workspace = true, features = ["std"] }
futures = { workspace = true }
hex = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true }
hyper = { workspace = true, optional = true, features = ["http1", "server"] }
hyper-util = { workspace = true, optional = true, features = ["http1"] }
mediatype = { workspace = true }
minicbor = { workspace = true, features = ["derive", "std"] }
multibase = { workspace = true, features = ["std"] }
multihash = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
starstream-proving-runtime = { workspace = true, optional = true }
starstream-runtime = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync"] }
tokio-io-timeout = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["codec", "io"] }
tower-http = { workspace = true, optional = true, features = ["timeout"] }
tracing = { workspace = true, features = ["attributes"] }
wasm-tokio = { workspace = true }
wasm-wave = { workspace = true, optional = true }
wasm-encoder = { workspace = true, features = ["wasmparser"] }
wasmparser = { workspace = true }
wasmprinter = { workspace = true }
wasmtime = { workspace = true, features = [
    "anyhow",
    "async",
    "component-model",
    "cranelift",
] }
wasmtime-wizer = { workspace = true, optional = true, features = [
    "component-model",
    "wasmtime",
] }
wit-bindgen-wrpc = { workspace = true }
wit-component = { workspace = true, optional = true }
wit-parser = { workspace = true, optional = true }
wrpc-http = { workspace = true, optional = true }
wrpc-transport = { workspace = true }

[build-dependencies]
anyhow = { workspace = true, optional = true }
wit-component = { workspace = true, optional = true }
wit-parser = { workspace = true, optional = true }

[dev-dependencies]
starstream-compiler = { workspace = true }
starstream-to-wasm = { workspace = true }
starstream-types = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
] }
wat = { workspace = true }
wit-component = { workspace = true }
