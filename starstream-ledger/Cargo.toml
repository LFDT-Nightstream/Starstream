[package]
name = "starstream-ledger"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["client", "server"]
client = [
    "dep:tokio",
    "dep:wasm-tokio",
    "dep:wasmtime",
    "dep:wasmtime-wizer",
    "dep:wit-bindgen-wrpc",
    "hyper-util/client",
    "hyper-util/client-legacy",
    "wrpc-http/client-legacy",
]
server = [
    "dep:futures",
    "dep:headers-accept",
    "dep:headers-core",
    "dep:http-body",
    "dep:hyper",
    "dep:tokio",
    "dep:wasm-tokio",
    "dep:wasmparser",
    "dep:wasmtime",
    "hyper-util/server",
    "hyper-util/server-auto",
    "hyper-util/server-graceful",
    "hyper-util/tokio",
]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
coset = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true, features = ["fast", "std", "zeroize"] }
futures = { workspace = true, optional = true }
headers-accept = { workspace = true, optional = true }
headers-core = { workspace = true, optional = true }
hex = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true }
hyper = { workspace = true, optional = true, features = ["server"] }
hyper-util = { workspace = true, features = ["http1", "http2"] }
mediatype = { workspace = true }
minicbor = { workspace = true, features = ["derive", "std"] }
multibase = { workspace = true, features = ["std"] }
multihash = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
starstream-runtime-next = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = [
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true, features = ["attributes"] }
wasm-tokio = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }
wasmprinter = { workspace = true }
wasmtime = { workspace = true, optional = true, features = [
    "anyhow",
    "async",
    "component-model",
    "cranelift",
] }
wasmtime-wizer = { workspace = true, optional = true, features = [
    "component-model",
    "wasmtime",
] }
wit-bindgen-wrpc = { workspace = true, optional = true }
wrpc-http = { workspace = true }
wrpc-transport = { workspace = true }

[dev-dependencies]
starstream-compiler = { workspace = true }
starstream-to-wasm = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "rt-multi-thread",
] }
wat = { workspace = true }
wit-component = { workspace = true }
