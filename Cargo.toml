[workspace]
resolver = "2"
members = [
  "starstream-cli",
  "starstream-compiler",
  "starstream-interpreter",
  "starstream-language-server",
  "starstream-language-server-web",
  "starstream-ledger",
  "starstream-ledger-cli",
  "starstream-ledger-node",
  "starstream-runtime",
  "starstream-sandbox-web",
  "starstream-to-wasm",
  "starstream-types",
  "starstream-interleaving-spec",
  "starstream-interleaving-prover",
  "starstream-proving-runtime",
  "examples/sha256lib",
]

[workspace.package]
version = "0.0.0"
authors = []
edition = "2024"
rust-version = "1.97.0"
repository = "https://github.com/LFDT-Nightstream/Starstream"
license = "MIT/Apache-2.0"

[workspace.dependencies]
anyhow = { version = "1.0.102", default-features = false }
base64 = "0.22.1"
bytes = { version = "1", default-features = false }
chumsky = "0.11.1"
clap = { version = "4.6.1", default-features = false }
coset = { version = "0.3", default-features = false }
cranelift-codegen = { version = "0.137", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
form_urlencoded = { version = "1", default-features = false }
futures = { version = "0.3", default-features = false }
hex = { version = "0.4.3", default-features = false }
http = { version = "1", default-features = false }
http-body = { version = "1", default-features = false }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
indoc = "2.0"
insta = "1.43"
mediatype = { version = "0.21", default-features = false }
miette = "7.6.0"
minicbor = { version = "2.3.0", default-features = false }
multibase = { version = "0.9", default-features = false }
multihash = { version = "0.19", default-features = false }
rand_core = { version = "0.6", default-features = false }
sha2 = "0.10.9"
serde = "1.0.219"
serde_bytes = "0.11"
serde_json = "1.0"
starstream-compiler = { path = "starstream-compiler" }
starstream-language-server = { path = "starstream-language-server" }
starstream-ledger = { path = "starstream-ledger", default-features = false }
starstream-ledger-cli = { path = "starstream-ledger-cli" }
starstream-ledger-node = { path = "starstream-ledger-node" }
starstream-proving-runtime = { path = "starstream-proving-runtime" }
starstream-runtime = { path = "starstream-runtime" }
starstream-to-wasm = { path = "starstream-to-wasm" }
starstream-types = { path = "starstream-types" }
tempfile = { version = "3.27", default-features = false }
toml = { version = "1.1", default-features = false }
test-log = { version = "0.2.18", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.47.1", default-features = false }
tokio-io-timeout = { version = "1.2.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tower-http = { version = "0.7.1", default-features = false }
tower-lsp-server = { version = "0.22.1", default-features = false, features = [
  "runtime-agnostic",
] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
wasm-bindgen = "0.2.128"
wasm-encoder = "0.261.0"
wasm-tokio = { version = "0.8", default-features = false }
wasm-wave = { version = "0.261.0", default-features = false }
wasmprinter = "0.261.0"
wat = "1.261.0"
wasmparser = "0.261.0"
wasmtime = { version = "50", default-features = false }
wasmtime-wizer = { version = "50", default-features = false }
wit-bindgen = "0.51.0"
wit-bindgen-wrpc = { version = "0.12", default-features = false }
wit-component = "0.261.0"
wit-parser = { version = "0.261.0", default-features = false }
wrpc-http = { version = "0.1", default-features = false }
wrpc-transport = { version = "0.30", default-features = false }
wrpc-wave = { version = "0.1", default-features = false }
zeroize = { version = "1.8.2", default-features = false }

neo-fold-clean = { git = "https://github.com/LFDT-Nightstream/Nightstream.git", rev = "7db6b98d4519d0e3767bf35bea392f70bd283120" }
neo-ajtai = { git = "https://github.com/LFDT-Nightstream/Nightstream.git", rev = "7db6b98d4519d0e3767bf35bea392f70bd283120" }
neo-math = { git = "https://github.com/LFDT-Nightstream/Nightstream.git", rev = "7db6b98d4519d0e3767bf35bea392f70bd283120" }
neo-ccs = { git = "https://github.com/LFDT-Nightstream/Nightstream.git", rev = "7db6b98d4519d0e3767bf35bea392f70bd283120" }
neo-params = { git = "https://github.com/LFDT-Nightstream/Nightstream.git", rev = "7db6b98d4519d0e3767bf35bea392f70bd283120" }
neo-application = { git = "https://github.com/LFDT-Nightstream/Nightstream.git", rev = "7db6b98d4519d0e3767bf35bea392f70bd283120" }
neo-wasm = { git = "https://github.com/LFDT-Nightstream/Nightstream.git", rev = "7db6b98d4519d0e3767bf35bea392f70bd283120" }

[profile.dev.package]
insta.opt-level = 3
