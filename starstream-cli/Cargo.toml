[package]
name = "starstream-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
default-run = "starstream"

[[bin]]
name = "starstream"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
console = "0.16.0"
ignore = "0.4.24"
miette = { workspace = true, features = ["fancy"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
similar = "2.7.0"
starstream-compiler = { workspace = true }
starstream-language-server = { workspace = true }
starstream-runtime = { workspace = true }
starstream-to-wasm = { workspace = true }
starstream-types = { workspace = true }
starstream-ledger-cli = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
] }
walkdir = "2.5.0"
wasmtime = { workspace = true, features = ["wave"] }
wit-component.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-std = "1.13.2"
starstream-ledger-cli = { workspace = true, features = ["proving", "tcp"] }
starstream-ledger-node = { workspace = true }
tokio = { version = "1.47.1", features = ["full"] }
tower-lsp-server = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
starstream-runtime = { workspace = true, features = [
    "wasmtime-custom-fiber",
    "wasmtime-custom-virtual-memory",
] }
starstream-runtime-web = { workspace = true }
