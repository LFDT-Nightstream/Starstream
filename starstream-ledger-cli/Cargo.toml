[package]
name = "starstream-ledger-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
bytes = { workspace = true }
clap = { workspace = true, features = [
    "color",
    "derive",
    "error-context",
    "help",
    "std",
    "string",
    "suggestions",
    "usage",
] }
ed25519-dalek = { workspace = true, features = [
    "fast",
    "rand_core",
    "zeroize",
] }
hex = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
hyper-util = { workspace = true, features = [
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
rand_core = { workspace = true, features = ["getrandom", "std"] }
sha2 = { workspace = true }
starstream-ledger = { workspace = true, features = ["client"] }
toml = { workspace = true, features = ["display", "serde"] }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "macros",
    "rt-multi-thread",
] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "ansi",
    "env-filter",
    "fmt",
    "smallvec",
    "tracing-log",
] }
wasm-wave = { workspace = true, features = ["wit"] }
wasmtime = { workspace = true, features = [
    "anyhow",
    "component-model",
    "cranelift",
    "wave",
] }
wit-parser = { workspace = true, features = ["decoding"] }
wrpc-wave = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
minicbor = { workspace = true, features = ["std"] }
starstream-compiler = { workspace = true }
starstream-ledger = { workspace = true, features = ["server"] }
starstream-runtime-next = { workspace = true }
starstream-to-wasm = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "process"] }
toml = { workspace = true, features = ["parse"] }
wit-component = { workspace = true }
